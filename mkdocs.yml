site_name: "vipps-login-hyva-magento documentation"
repo_url: https://github.com/vippsas/vipps-login-hyva-magento/
edit_uri: edit/main/docs/
nav:
  - 'Home': ./ # will be README or INDEX.MD
  # - 'Document 1': document1.md
  # - 'Sub menu':
  #   - 'Document 2': document2.md
plugins:
  - techdocs-core
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg